<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030711" />
      <stop offset="45%" stop-color="#071022" />
      <stop offset="80%" stop-color="#0a1931" />
      <stop offset="100%" stop-color="#040914" />
    </linearGradient>

    <radialGradient id="cyanAura1" cx="72%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00d8ff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanAura2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradients -->
    <linearGradient id="silverText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Glass Pill Gradients -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1d33" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#091324" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#11223d" stop-opacity="0.88" />
    </linearGradient>

    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.65" />
    </linearGradient>

    <!-- Laser Wave Gradients -->
    <linearGradient id="waveCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#e0f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="waveSoft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>

    <pattern id="dotGridFine" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#94a3b8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .title-main {
      font-family: 'Segoe UI', 'Inter', 'Montserrat', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 62px;
      letter-spacing: 2.5px;
    }
    .subtitle {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 23px;
      fill: #f1f5f9;
      letter-spacing: 0.4px;
    }
    .pill-text-bold {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 17px;
      fill: #ffffff;
    }
    .pill-text-light {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #cbd5e1;
    }
    .tagline {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #e2e8f0;
      letter-spacing: 0.2px;
    }
    .footer-text {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 16.5px;
      fill: #cbd5e1;
    }
    .footer-bold {
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 16.5px;
      fill: #ffffff;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -400; }
    }
    .glow-wave {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .energy-stream {
      stroke-dasharray: 120 280;
      animation: dashFlow 7s linear infinite;
    }
    .float-icon {
      animation: floatSlow 5s ease-in-out infinite;
    }
  </style>

  <!-- 1. Base Background -->
  <rect width="1400" height="400" fill="url(#bgGrad)" />
  <rect width="1400" height="400" fill="url(#cyanAura1)" />
  <rect width="1400" height="400" fill="url(#cyanAura2)" />

  <!-- 2. Particle Dot Grids -->
  <rect x="820" y="0" width="580" height="220" fill="url(#dotGrid)" opacity="0.7" />
  <rect x="450" y="230" width="600" height="170" fill="url(#dotGrid)" opacity="0.55" />
  <rect x="20" y="160" width="260" height="180" fill="url(#dotGridFine)" opacity="0.6" />

  <!-- 3. Subtle Cyber Frame & Circuit Lines (Left & Top) -->
  <path d="M 0,210 C 65,210 110,165 145,105 C 180,45 215,38 290,38 L 760,38" 
        fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.55" />
  <path d="M 885,38 L 1300,38" 
        fill="none" stroke="url(#waveSoft)" stroke-width="2" filter="url(#neonGlow)" />
  <circle cx="1300" cy="38" r="3.5" fill="#e0f2fe" filter="url(#neonGlow)" />

  <!-- Circuit Traces on Right -->
  <g stroke="#1e3a5f" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M 1060,145 L 1170,145 L 1195,120 L 1265,120" />
    <circle cx="1265" cy="120" r="2.5" fill="#38bdf8" />
    <path d="M 1090,155 L 1195,155" />
    <circle cx="1195" cy="155" r="2" fill="#38bdf8" />
    <path d="M 650,110 L 735,110" />
    <circle cx="735" cy="110" r="2" fill="#38bdf8" />
  </g>

  <!-- 4. Sweeping Futuristic Neon Energy Waves -->
  <!-- Main diagonal sweeping arc from top-right to center -->
  <path class="glow-wave" d="M 810,185 C 900,95 1015,28 1135,0" 
        fill="none" stroke="url(#waveCyan)" stroke-width="3.5" filter="url(#neonGlow)" />
  <path class="energy-stream" d="M 810,185 C 900,95 1015,28 1135,0" 
        fill="none" stroke="#ffffff" stroke-width="2" />

  <!-- Sweeping bottom-left to top-right wave -->
  <path d="M 0,250 C 90,275 180,350 280,385 C 480,435 760,335 980,260 C 1140,205 1280,135 1400,95" 
        fill="none" stroke="url(#waveSoft)" stroke-width="2.5" filter="url(#neonGlow)" />
  
  <path class="glow-wave" d="M 860,400 C 965,310 1125,220 1400,155" 
        fill="none" stroke="url(#waveCyan)" stroke-width="3.5" filter="url(#neonGlow)" />

  <path d="M 940,400 C 1060,340 1220,285 1400,265" 
        fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.6" />

  <path d="M 0,295 C 85,320 155,365 210,400" 
        fill="none" stroke="#0284c7" stroke-width="1.8" opacity="0.5" />

  <!-- Glowing Orbs / Nodes on Waves -->
  <circle cx="912" cy="108" r="3" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="1130" cy="252" r="4" fill="#e0f2fe" filter="url(#neonGlow)" />
  <circle cx="842" cy="272" r="3" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="162" cy="221" r="3.5" fill="#e0f2fe" filter="url(#neonGlow)" />
  <circle cx="105" cy="356" r="3" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="1373" cy="326" r="4" fill="#7dd3fc" filter="url(#neonGlow)" />

  <!-- 5. Futuristic Tech Wireframe Icons (Cubes, Gears, Code, Chip) -->
  <!-- Gear Top Left -->
  <g transform="translate(22, 42)" stroke="#334155" stroke-width="1.8" fill="none" opacity="0.6">
    <circle cx="12" cy="12" r="5" />
    <path d="M12,2 L12,5 M12,19 L12,22 M2,12 L5,12 M19,12 L22,12 M5,5 L7,7 M17,17 L19,19 M19,5 L17,7 M7,17 L5,19" />
  </g>

  <!-- Isometric Cube Left -->
  <g class="float-icon" transform="translate(55, 75)" stroke="#1e3a5f" stroke-width="1.5" fill="none" opacity="0.75">
    <polygon points="15,0 30,8 30,24 15,32 0,24 0,8" fill="#091526" fill-opacity="0.5" />
    <polyline points="0,8 15,16 30,8" />
    <line x1="15" y1="16" x2="15" y2="32" />
    <circle cx="0" cy="8" r="2" fill="#38bdf8" filter="url(#neonGlow)" />
  </g>

  <!-- Rounded Square Node Top Right-Center -->
  <g class="float-icon" transform="translate(880, 22)" opacity="0.65">
    <rect x="0" y="0" width="28" height="28" rx="5" fill="#0c192e" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <rect x="6" y="6" width="16" height="16" rx="2" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2" />
  </g>

  <!-- Automation / Bot Icon Right -->
  <g class="float-icon" transform="translate(1072, 142)" opacity="0.75">
    <rect x="0" y="0" width="38" height="34" rx="7" fill="#0b172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.55" />
    <rect x="8" y="10" width="22" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="14" cy="17" r="2" fill="#38bdf8" />
    <circle cx="24" cy="17" r="2" fill="#38bdf8" />
    <line x1="19" y1="4" x2="19" y2="10" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="19" cy="3" r="1.8" fill="#7dd3fc" />
  </g>

  <!-- 3D Isometric Cube Bottom Right -->
  <g class="float-icon" transform="translate(1312, 268)" stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.65">
    <polygon points="22,0 44,11 44,35 22,46 0,35 0,11" fill="#0b1528" fill-opacity="0.7" />
    <polyline points="0,11 22,22 44,11" />
    <line x1="22" y1="22" x2="22" y2="46" />
  </g>

  <!-- Gear Bottom Right -->
  <g transform="translate(1232, 326)" stroke="#475569" stroke-width="1.8" fill="none" opacity="0.55">
    <circle cx="12" cy="12" r="5" />
    <path d="M12,2 L12,5 M12,19 L12,22 M2,12 L5,12 M19,12 L22,12 M5,5 L7,7 M17,17 L19,19 M19,5 L17,7 M7,17 L5,19" />
  </g>

  <!-- Terminal & Code Brackets Bottom Left -->
  <g transform="translate(36, 336)" opacity="0.55">
    <rect x="0" y="0" width="32" height="28" rx="6" fill="#0b1528" stroke="#334155" stroke-width="1.2" />
    <line x1="7" y1="9" x2="20" y2="9" stroke="#64748b" stroke-width="1.5" />
    <line x1="7" y1="15" x2="25" y2="15" stroke="#64748b" stroke-width="1.5" />
    <line x1="7" y1="21" x2="16" y2="21" stroke="#38bdf8" stroke-width="1.5" />
  </g>
  <g transform="translate(95, 372)" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7">
    <polyline points="8,0 0,7 8,14" />
    <polyline points="20,0 28,7 20,14" stroke="#38bdf8" />
  </g>

  <!-- 6. MAIN TYPOGRAPHY: DIDIER PUENTES -->
  <g filter="url(#softShadow)">
    <text x="215" y="114" class="title-main">
      <tspan fill="url(#silverText)">DIDIER</tspan><tspan dx="14" fill="url(#cyanText)">PUENTES</tspan>
    </text>
  </g>

  <!-- 7. SUBTITLE -->
  <text x="216" y="162" class="subtitle">
    Full Stack Developer <tspan fill="#38bdf8" font-weight="700" dx="6" dy="0">•</tspan><tspan dx="6" fill="#f1f5f9">Web, Mobile &amp; AI Systems</tspan>
  </text>

  <!-- 8. MIDDLE GLASSMORPHISM TECH STACK PILL -->
  <g transform="translate(214, 185)" filter="url(#softShadow)">
    <rect x="0" y="0" width="885" height="48" rx="24" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1.3" />
    
    <!-- Laravel Icon & Text -->
    <g transform="translate(24, 11)">
      <path d="M23.6,7.5 L19.2,5 C18.8,4.8 18.3,4.8 17.9,5 L13.5,7.5 C13.1,7.7 12.9,8.2 12.9,8.6 L12.9,15.5 L8.3,18.1 L8.3,4.6 C8.3,4.1 8,3.7 7.6,3.5 L3.2,1 C2.8,0.8 2.3,0.8 1.9,1 L-2.5,3.5 C-2.9,3.7 -3.1,4.1 -3.1,4.6 L-3.1,20.5 C-3.1,21 -2.9,21.4 -2.5,21.6 L6.5,26.8 C6.9,27 7.4,27 7.8,26.8 L16.8,21.6 C17.2,21.4 17.4,21 17.4,20.5 L17.4,13.6 L22.3,10.8 C22.7,10.6 23,10.1 23,9.7 L23,8.6 C23,8.2 23.9,7.7 23.6,7.5 Z" 
            transform="translate(4, -1) scale(0.85)" fill="none" stroke="#FF2D20" stroke-width="2.1" stroke-linejoin="round" />
      <text x="32" y="19" class="pill-text-bold">Laravel <tspan class="pill-text-light" font-weight="400">(Web &amp; API REST)</tspan></text>
    </g>

    <!-- Dot 1 -->
    <circle cx="290" cy="24" r="3" fill="#00e5ff" filter="url(#neonGlow)" />

    <!-- Python Icon & Text -->
    <g transform="translate(308, 12)">
      <path d="M11.8,0 C6.2,0 6.6,2.4 6.6,2.4 L6.6,5 L12,5 L12,5.8 L4.4,5.8 C4.4,5.8 0.8,5.4 0.8,11 C0.8,16.6 4,16.4 4,16.4 L5.8,16.4 L5.8,13.8 C5.8,13.8 5.7,10.6 9,10.6 L14.4,10.6 C14.4,10.6 17.4,10.6 17.4,7.7 L17.4,2.9 C17.4,2.9 17.8,0 11.8,0 Z" fill="#387EB8" />
      <path d="M12.2,24 C17.8,24 17.4,21.6 17.4,21.6 L17.4,19 L12,19 L12,18.2 L19.6,18.2 C19.6,18.2 23.2,18.6 23.2,13 C23.2,7.4 20,7.6 20,7.6 L18.2,7.6 L18.2,10.2 C18.2,10.2 18.3,13.4 15,13.4 L9.6,13.4 C9.6,13.4 6.6,13.4 6.6,16.3 L6.6,21.1 C6.6,21.1 6.2,24 12.2,24 Z" fill="#FFE052" />
      <circle cx="9.2" cy="2.6" r="1" fill="#ffffff" />
      <circle cx="14.8" cy="21.4" r="1" fill="#ffffff" />
      <text x="31" y="18" class="pill-text-bold">Python <tspan class="pill-text-light">&amp; IA</tspan></text>
    </g>

    <!-- Dot 2 -->
    <circle cx="458" cy="24" r="3" fill="#00e5ff" filter="url(#neonGlow)" />

    <!-- React Icon & Text -->
    <g transform="translate(476, 12)">
      <g transform="translate(12, 12)">
        <circle cx="0" cy="0" r="2.3" fill="#61DAFB" />
        <ellipse rx="11" ry="4.2" fill="none" stroke="#61DAFB" stroke-width="1.5" />
        <ellipse rx="11" ry="4.2" fill="none" stroke="#61DAFB" stroke-width="1.5" transform="rotate(60)" />
        <ellipse rx="11" ry="4.2" fill="none" stroke="#61DAFB" stroke-width="1.5" transform="rotate(120)" />
      </g>
      <text x="31" y="18" class="pill-text-bold">React <tspan class="pill-text-light">&amp; Next</tspan></text>
    </g>

    <!-- Dot 3 -->
    <circle cx="634" cy="24" r="3" fill="#00e5ff" filter="url(#neonGlow)" />

    <!-- Flutter Icon & Text -->
    <g transform="translate(652, 12)">
      <polygon points="14,0 2,12 6,16 22,0" fill="#47C5FB" />
      <polygon points="14,11 7.5,17.5 14,24 22,24 15.5,17.5 22,11" fill="#47C5FB" />
      <polygon points="11.5,21.5 14,24 22,24 15.5,17.5" fill="#00569E" />
      <text x="29" y="18" class="pill-text-bold">Flutter <tspan class="pill-text-light">(Mobile)</tspan></text>
    </g>
  </g>

  <!-- 9. TAGLINE -->
  <text x="216" y="276" class="tagline">
    Sistemas modernos, escalables e inteligentes para negocios reales.
  </text>

  <!-- 10. BOTTOM GLASSMORPHISM CONTACT BAR -->
  <g transform="translate(214, 324)" filter="url(#softShadow)">
    <rect x="0" y="0" width="760" height="46" rx="14" fill="url(#pillBg)" stroke="url(#pillBorder)" stroke-width="1.2" />

    <!-- Envelope Icon -->
    <g transform="translate(24, 14)">
      <rect x="0" y="0" width="22" height="16" rx="2.5" fill="#94a3b8" />
      <polyline points="1,1 11,9 21,1" fill="none" stroke="#0f172a" stroke-width="1.8" />
    </g>
    <text x="58" y="29" class="footer-text">campodidier07@gmail.com</text>

    <!-- Cyan Divider 1 -->
    <line x1="312" y1="11" x2="312" y2="35" stroke="#00e5ff" stroke-width="1.8" opacity="0.85" />

    <!-- GitHub Icon -->
    <g transform="translate(334, 11)">
      <path d="M12,0 C5.37,0 0,5.37 0,12 C0,17.3 3.44,21.8 8.2,23.38 C8.8,23.49 9.02,23.13 9.02,22.81 C9.02,22.53 9.01,21.79 9.01,20.81 C5.67,21.53 4.97,19.2 4.97,19.2 C4.42,17.81 3.63,17.44 3.63,17.44 C2.54,16.7 3.71,16.71 3.71,16.71 C4.92,16.8 5.55,17.95 5.55,17.95 C6.62,19.79 8.36,19.26 9.05,18.95 C9.16,18.17 9.47,17.65 9.81,17.35 C7.15,17.05 4.35,16.02 4.35,11.42 C4.35,10.11 4.82,9.04 5.58,8.2 C5.46,7.9 5.05,6.68 5.7,5.04 C5.7,5.04 6.7,4.72 8.99,6.27 C9.95,6 10.98,5.87 12,5.86 C13.02,5.87 14.05,6 15.01,6.27 C17.3,4.72 18.3,5.04 18.3,5.04 C18.95,6.68 18.54,7.9 18.42,8.2 C19.19,9.04 19.65,10.11 19.65,11.42 C19.65,16.03 16.84,17.04 14.17,17.34 C14.6,17.71 14.99,18.45 14.99,19.58 C14.99,21.2 14.97,22.41 14.97,22.81 C14.97,23.13 15.19,23.5 15.8,23.38 C20.56,21.8 24,17.3 24,12 C24,5.37 18.63,0 12,0 Z" 
            fill="#e2e8f0" transform="scale(0.95)" />
    </g>
    <text x="368" y="29" class="footer-text">GitHub: <tspan class="footer-bold">campodidier07-collab</tspan></text>

    <!-- Cyan Divider 2 -->
    <line x1="616" y1="11" x2="616" y2="35" stroke="#00e5ff" stroke-width="1.8" opacity="0.85" />

    <!-- Location Badge -->
    <text x="634" y="29" class="footer-bold" fill="#38bdf8">🇨🇴 <tspan fill="#e2e8f0" font-weight="500">Colombia</tspan></text>
  </g>
</svg>

